name: Headroom comparison

on:
  push:
    branches: [research/headroom-comparison-20260919, main]
    paths:
      - 'experiments/headroom_compare/**/*.py'
      - 'invariant_compression_benchmark.py'
      - 'external_validation/headroom_external_eval.py'
      - 'external_validation/real_issue_snapshot.json'
      - '.github/workflows/headroom-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headroom-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: ['0.36.0', '0.37.0', 'source-bc21c93']
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      HEADROOM_UPDATE_CHECK: 'off'
      DO_NOT_TRACK: '1'
      HEADROOM_TEST_NATIVE: '1'
      CARGO_BUILD_JOBS: '2'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare output directory
        run: mkdir -p 'experiments/headroom_compare/runs/${{ matrix.runtime }}'
      - name: Install unchanged published runtime
        if: ${{ !startsWith(matrix.runtime, 'source-') }}
        run: |
          python -m pip install --only-binary=:all: 'headroom-ai==${{ matrix.runtime }}' 'tiktoken==0.14.0' --report 'experiments/headroom_compare/runs/${{ matrix.runtime }}/install.json'
      - name: Install unchanged pinned source
        if: startsWith(matrix.runtime, 'source-')
        timeout-minutes: 20
        run: |
          rustup update stable --no-self-update
          rustup default stable
          python -m pip install 'tiktoken==0.14.0' 'headroom-ai @ git+https://github.com/headroomlabs-ai/headroom.git@bc21c9370793f7e4aa94ac4c5d9a67a8d2dd0df9' --report 'experiments/headroom_compare/runs/${{ matrix.runtime }}/install.json'
      - name: Test evaluator and native entry points
        run: python -m unittest discover -s experiments/headroom_compare -p 'test_*.py' -v
      - name: Run frozen pilot
        timeout-minutes: 10
        run: |
          set -o pipefail
          python experiments/headroom_compare/compare.py --runtime '${{ matrix.runtime }}' --output 'experiments/headroom_compare/runs/${{ matrix.runtime }}' 2>&1 | tee 'experiments/headroom_compare/runs/${{ matrix.runtime }}/execution.log'
      - name: Audit saved native evidence
        run: python experiments/headroom_compare/audit_artifacts.py 'experiments/headroom_compare/runs/${{ matrix.runtime }}'
      - name: Run full 960-case baseline follow-up
        if: matrix.runtime == '0.36.0'
        run: |
          mkdir -p 'experiments/headroom_compare/runs/${{ matrix.runtime }}/full-960'
          python experiments/headroom_compare/full_960_baseline.py --output 'experiments/headroom_compare/runs/${{ matrix.runtime }}/full-960'
      - name: Run nullable empty-string vs null repro
        run: |
          mkdir -p 'experiments/headroom_compare/runs/${{ matrix.runtime }}/nullable-repro'
          python experiments/headroom_compare/nullable_repro.py --output 'experiments/headroom_compare/runs/${{ matrix.runtime }}/nullable-repro'
      - name: Validate proposed upstream nullable fix
        if: matrix.runtime == 'source-bc21c93'
        timeout-minutes: 20
        run: |
          git clone --filter=blob:none https://github.com/headroomlabs-ai/headroom.git /tmp/headroom-fix
          cd /tmp/headroom-fix
          git checkout bc21c9370793f7e4aa94ac4c5d9a67a8d2dd0df9
          python "$GITHUB_WORKSPACE/experiments/headroom_compare/apply_upstream_null_empty_fix.py"             crates/headroom-core/src/transforms/smart_crusher/compaction/formatter.rs
          git diff --check
          git diff > "$GITHUB_WORKSPACE/experiments/headroom_compare/runs/source-bc21c93/upstream_null_empty_fix.patch"
          cargo test -p headroom-core csv_formatter_distinguishes_missing_null_empty_and_literal_null
          cargo test -p headroom-core csv_formatter_nullable_swap_is_not_identical
      - name: Preserve environment and source
        if: always()
        run: |
          python -m pip freeze > 'experiments/headroom_compare/runs/${{ matrix.runtime }}/environment-final.txt'
          cp experiments/headroom_compare/*.py experiments/headroom_compare/*.md 'experiments/headroom_compare/runs/${{ matrix.runtime }}/'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: headroom-comparison-${{ matrix.runtime }}
          path: experiments/headroom_compare/runs/${{ matrix.runtime }}/
          if-no-files-found: error
          retention-days: 90