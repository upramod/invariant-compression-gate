name: Held-out external validation

on:
  push:
    branches: [research/heldout-external-validation-20260919]
    paths:
      - 'experiments/heldout_external/**'
      - '.github/workflows/heldout-external-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Test frozen corpus and contracts
        run: python -m unittest discover -s experiments/heldout_external -p 'test_*.py' -v

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: ['0.37.0', 'source-67eb910']
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      HEADROOM_UPDATE_CHECK: 'off'
      DO_NOT_TRACK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare output
        run: mkdir -p 'experiments/heldout_external/runs/${{ matrix.runtime }}'
      - name: Install released runtime
        if: ${{ !startsWith(matrix.runtime, 'source-') }}
        run: |
          python -m pip install --only-binary=:all: 'headroom-ai==0.37.0' 'tiktoken==0.14.0'
      - name: Install pinned source runtime
        if: startsWith(matrix.runtime, 'source-')
        timeout-minutes: 20
        run: |
          rustup update stable --no-self-update
          rustup default stable
          python -m pip install 'tiktoken==0.14.0' 'headroom-ai @ git+https://github.com/headroomlabs-ai/headroom.git@67eb910e38b9879bb0bcbacdc36db69e36901075'
      - name: Run held-out experiment
        run: |
          python experiments/heldout_external/experiment.py             --runtime '${{ matrix.runtime }}'             --output 'experiments/heldout_external/runs/${{ matrix.runtime }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: heldout-external-${{ matrix.runtime }}
          path: experiments/heldout_external/runs/${{ matrix.runtime }}/
          if-no-files-found: error
          retention-days: 90
