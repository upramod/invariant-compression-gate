name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run core benchmark
        run: python invariant_compression_benchmark.py --output-dir reproduced_results
      - name: Verify expected result files
        run: |
          test -f reproduced_results/summary.csv
          test -f reproduced_results/results.csv
